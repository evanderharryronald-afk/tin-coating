name: tin-coating

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: pytest smoke (default, skips e2e)
        run: pytest tests/test_smoke.py -v

      - name: Quick import sanity (tin_coating + prod entry both loadable)
        run: |
          python -c "import tin_coating; print('tin_coating OK')"
          python -c "import coating_model_by_group; print('prod entry OK')"
