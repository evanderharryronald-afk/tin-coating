[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tin-coating"
version = "0.1.0"
description = "连续热镀锌线镀层重量偏差校正 — Top/Bot 表面 HistGradientBoostingResidualCorrection 模型"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy>=1.23,<1.27",
    "pandas>=2.0,<2.2",
    "scikit-learn>=1.3,<1.5",
    "matplotlib>=3.7,<3.9",
    "seaborn>=0.12,<0.14",
    "openpyxl>=3.1",
    "optuna>=3.0,<5.2",
    "joblib>=1.3,<1.6",
    "pyyaml>=6.0",
]

[project.scripts]
tin-coating = "cli.main:main"

[tool.setuptools.packages.find]
include = ["tin_coating*", "cli*"]
